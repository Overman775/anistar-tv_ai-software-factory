# Initial, uncalibrated threshold: confidence = abs(2*p - 1); yes >= 0.7, no <= 0.3.
# Questions only. Task-specific answers belong in policy_decisions.
decisions:
  - id: dart-changes
    type: predicate
    min_confidence: 0.4
    question: Are standalone AniStar Dart/Flutter static checks required for these changes? Answer false when the
      planned final melos check covers the same integrated candidate bytes; avoid repeating the workspace triplet for
      every Dart slice. Answer true for uncovered static work or an explicit early static-check requirement. Include
      generated/code/toolchain inputs and cite the planned final check or other scoped evidence for false.
  - id: application-changes
    type: predicate
    min_confidence: 0.4
    question: Do these changes require full AniStar application completion (check, fixture E2E, production APK)? Record
      evidence for false; focused tests alone cannot waive full gates.
