# Tutorial example. Selected explicitly; does not overwrite existing settings.

# Application profile: documents, rules and project gates.
project: project/project.yaml

# Coordinator instructions for selecting the team and workers.
router: workflow/router.md

# Coordinator instructions for launching, waiting and accepting results.
orchestration: workflow/orchestration.md

# Shared task retry budgets; changing the worker does not reset the counter.
execution:
  retry_budgets:
    static: 2
    tests: 2
    docs: 2
    review:
      feature: 2
      other: 1
    recovery: 1
  on_budget_exhausted: human

# Specialties: shared permissions and tools, then model and adapter variants.
# Variants do not override shared fields. Variant names are unique across the factory.
# default required with multiple variants; a single variant is selected automatically.
# capabilities/MCP — instruction policy, not sandbox; enforcement: required blocks generic dispatch.
# MCP servers and secrets are configured in harness, not here.
profiles:
  developer:
    role: roles/developer.md
    contract: contracts/developer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - dcm.dcm_format
      - context7.resolve-library-id
      - context7.query-docs
    default: middle-developer
    variants:
      middle-developer:
        model: terra
        adapter: codex
        escalation:
          to: senior-developer
          after_failed_attempts: 1
      junior-developer:
        model: luna
        adapter: codex
        escalation:
          to: middle-developer
          after_failed_attempts: 1
      senior-developer:
        model: sol
        adapter: codex
        escalation:
          to: human
          after_failed_attempts: 2
      middle-developer-zcode:
        model: glm-5-3
        adapter: zcode
        escalation:
          to: senior-developer
          after_failed_attempts: 1

  test-writer:
    role: roles/test-writer.md
    contract: contracts/test-writer.md
    capabilities: {read: true, edit: true, commands: true, web: false}
    enforcement: instructions
    mcp:
      - dcm.dcm_analyze
    default: middle-test-writer
    variants:
      middle-test-writer:
        model: terra
        adapter: codex
        escalation:
          to: senior-test-writer
          after_failed_attempts: 1
      junior-test-writer:
        model: luna
        adapter: codex
        escalation:
          to: middle-test-writer
          after_failed_attempts: 1
      senior-test-writer:
        model: sol
        adapter: codex
        escalation:
          to: human
          after_failed_attempts: 2
      middle-test-writer-zcode:
        model: glm-5-3
        adapter: zcode
        escalation:
          to: senior-test-writer
          after_failed_attempts: 1
      middle-test-writer-pi:
        model: deepseek-flash
        adapter: pi
        escalation:
          to: senior-test-writer
          after_failed_attempts: 1

  generalist:
    role: roles/generalist.md
    contract: contracts/generalist.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dcm.dcm_analyze
    variants:
      generalist:
        model: sol
        adapter: codex

  judge:
    role: roles/judge.md
    contract: contracts/judge.md
    capabilities: {read: true, edit: false, commands: true, web: false}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    variants:
      judge:
        model: sol
        adapter: codex

  code-explorer:
    role: roles/code-explorer.md
    contract: contracts/code-explorer.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
    variants:
      code-explorer:
        model: sol
        adapter: codex

  bug-hunter:
    role: roles/bug-hunter.md
    contract: contracts/bug-hunter.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
      - dart.dtd
      - dart.get_runtime_errors
      - dart.hot_restart
      - dart.hot_reload
    variants:
      bug-hunter:
        model: sol
        adapter: codex

  doc-writer:
    role: roles/doc-writer.md
    contract: contracts/doc-writer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      doc-writer:
        model: sol
        adapter: codex

  architect:
    role: roles/architect.md
    contract: contracts/architect.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      architect:
        model: sol
        adapter: codex

  task-decomposer:
    role: roles/task-decomposer.md
    contract: contracts/task-decomposer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-decomposer:
        model: sol
        adapter: codex

  task-reviewer:
    role: roles/task-reviewer.md
    contract: contracts/task-reviewer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-reviewer:
        model: sol
        adapter: codex

  reviewer:
    role: roles/reviewer.md
    contract: contracts/reviewer.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    variants:
      reviewer:
        model: sol
        adapter: codex

# Models: exact ID and parameters, referenced by variants.
models:
  # Primary model for native workers.
  terra:
    id: gpt-6.1-terra
    # Requested reasoning level; applies only when supported by the harness.
    effort: high

  # Junior model from the accepted allocation.
  luna:
    id: gpt-6-luna
    effort: high

  # Model for senior and other specialties.
  sol:
    id: gpt-6.1-sol
    effort: high

  # GLM-5.3 via ZCode: copy the exact value from your bridge model configOptions.
  # Current zcode-acp publishes providerId\modelId; case and provider depend on the catalog.
  # Example below for Z.ai Coding Plan. This value does not confirm availability in your account.
  # ACP effort not set: helper has no universal mapping.
  glm-5-3:
    id: 'builtin:zai-coding-plan\GLM-5.3'

  # Pi ACP accepts provider/model. deepseek-flash — API alias for the V4.1 Flash family.
  # Provider, key and model must be configured beforehand in Pi.
  deepseek-flash:
    id: deepseek/deepseek-flash

# Adapter connects the harness to the transport. This is not a model.
adapters:
  codex:
    # Coordinator instructions: creation, waiting, recovery.
    instructions: adapters/codex.md
    # Worker instructions for available harness tools.
    worker_instructions: adapters/worker/codex.md
    # Harness in which the agent runs.
    harness: codex
    # native — API of the current harness; acpx — external ACP client.
    runner: native

  # Native Claude adapter; requires a profile with a model supported by this harness.
  claude:
    instructions: adapters/claude.md
    worker_instructions: adapters/worker/claude.md
    harness: claude
    runner: native

  # ZCode — harness, zcode-acp — bridge, acpx — ACP protocol client.
  zcode:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: zcode
    runner: acpx
    # Alias from acpx.connections; not a model name or MCP server.
    connection: zcode

  # Pi — harness; used bridge — svkozak/pi-acp.
  pi:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: pi
    runner: acpx
    connection: pi

# Local pool of unfinished native assignments, excluding the coordinator.
native:
  max_parallel_agents: 3  # factory limit, not a subscription quota

# Actual acpx CLI settings; backend processes run separately.
acpx:
  # Installed client command. Helper does not install packages.
  command: acpx
  # One connection shares a pool across all assigned profiles.
  connections:
    # Bridge william0wang/zcode-acp launches a real ZCode app-server.
    # Configure MCP in the harness, not through profiles.*.mcp strings.
    # For ZCode CLI: ~/.zcode/cli/config.json → mcp.servers. Example JSON shape:
    # {
    #   "mcp": {
    #     "servers": {
    #       "context7": {
    #         "type": "stdio",
    #         "command": "npx",
    #         "args": ["-y", "@upstash/context7-mcp"],
    #         "env": {"CONTEXT7_API_KEY": "<key in local configuration>"}
    #       }
    #     }
    #   }
    # }
    # For DCM: command "dcm", args ["start-mcp-server", "--force-roots-fallback"].
    # For HTTP server use url and headers according to client documentation.
    # Keys are not stored here; helper does not copy MCP configuration between harnesses.
    zcode:
      command: zcode-acp
      # Separate process arguments; server enables stdio ACP, not a terminal UI.
      args:
        - server
      max_parallel_agents: 3  # limit on concurrent unfinished assignments for this connection
      # Actual acpx mode: approve-reads / approve-all / deny-all.
      # approve-reads + noninteractive fail does not automatically approve write requests.
      # These are responses to permission requests, not a restriction on local harness tools.
      permissions: approve-reads

    # svkozak/pi-acp launches without server and uses the installed Pi.
    # MCP requires a separate Pi extension; accepted ACP mcpServers are not connected automatically.
    # Pi runs file operations and commands locally, without ACP fs/terminal delegation.
    pi:
      command: pi-acp
      args: []
      max_parallel_agents: 3
      permissions: approve-reads
