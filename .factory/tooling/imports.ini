[importlinter]
root_package = factory
include_external_packages = False

[importlinter:contract:decision-boundary]
name = Decision contracts stay independent of consumers
type = forbidden
source_modules = factory.decisions
forbidden_modules =
    factory.runtime
    factory.project
    factory.context
    factory.adapters
    factory.review
    factory.planning
    factory.decompose

[importlinter:contract:context-boundary]
name = Context construction does not import workflow transitions or transports
type = forbidden
source_modules = factory.context
forbidden_modules =
    factory.runtime.workflow
    factory.runtime.transitions
    factory.runtime.run_journal
    factory.adapters

[importlinter:contract:process-boundary]
name = Command execution does not own workflow or review decisions
type = forbidden
source_modules = factory.runtime.commands.process
forbidden_modules =
    factory.runtime.workflow
    factory.runtime.transitions
    factory.runtime.run_journal
    factory.review
    factory.project

[importlinter:contract:shared-leaves]
name = Shared paths and validation do not depend on factory features
type = forbidden
source_modules =
    factory.paths
    factory.validation
forbidden_modules =
    factory.adapters
    factory.context
    factory.decisions
    factory.decompose
    factory.diagnostics
    factory.gates
    factory.github
    factory.planning
    factory.project
    factory.review
    factory.runtime
    factory.quality
    factory.test_suite
    factory.yaml_checks

[importlinter:contract:check-declarations]
name = Shared check declarations do not depend on feature packages
type = forbidden
source_modules = factory.checks
forbidden_modules =
    factory.adapters
    factory.context
    factory.decisions
    factory.decompose
    factory.diagnostics
    factory.gates
    factory.github
    factory.planning
    factory.project
    factory.review
    factory.runtime
    factory.tasks

[importlinter:contract:task-contracts]
name = Task contracts do not depend on project or runtime
type = forbidden
source_modules = factory.tasks
forbidden_modules =
    factory.project
    factory.runtime

[importlinter:contract:project-policy-contracts]
name = Project policy selection and contracts do not depend on runtime
type = forbidden
source_modules =
    factory.project.contracts
    factory.project.profile_rules
forbidden_modules = factory.runtime

[importlinter:contract:workflow-transition-boundary]
name = Workflow transitions are independent of their public and transport entry points
type = forbidden
source_modules = factory.runtime.transitions
forbidden_modules =
    factory.runtime.workflow
    factory.runtime.workflow_cli
    factory.adapters

[importlinter:contract:run-journal-boundary]
name = The run journal is independent of workflow transitions
type = forbidden
source_modules = factory.runtime.run_journal
forbidden_modules =
    factory.runtime.transitions
    factory.runtime.workflow
    factory.runtime.workflow_cli

[importlinter:contract:persistence-ports]
name = Persistence contracts stay independent of database implementation and commands
type = forbidden
source_modules =
    factory.database.port
    factory.runtime.run_repository
    factory.runtime.history.history_repository
    factory.runtime.packets.repository
    factory.runtime.knowledge.teacher_job_repository
    factory.runtime.knowledge.case_index
    factory.runtime.knowledge.lesson_index
    factory.runtime.knowledge.lesson_trace_repository
    factory.runtime.observability.export_feed
    factory.diagnostics.diagnostic_journal
forbidden_modules =
    factory.database.provider
    factory.database.sqlite
    factory.runtime.workflow
    factory.runtime.workflow_cli
