[importlinter]
root_package = factory
include_external_packages = False

[importlinter:contract:decision-boundary]
name = Decision contracts stay independent of consumers
type = forbidden
source_modules = factory.decisions
forbidden_modules =
    factory.runtime
    factory.project
    factory.context
    factory.adapters
    factory.review
    factory.planning
    factory.decompose

[importlinter:contract:context-boundary]
name = Context construction does not import workflow transitions or transports
type = forbidden
source_modules = factory.context
forbidden_modules =
    factory.runtime.workflow
    factory.adapters

[importlinter:contract:process-boundary]
name = Command execution does not own workflow or review decisions
type = forbidden
source_modules = factory.runtime.check_process
forbidden_modules =
    factory.runtime.workflow
    factory.review
    factory.project

[importlinter:contract:shared-leaves]
name = Shared paths and validation do not depend on factory features
type = forbidden
source_modules =
    factory.paths
    factory.validation
forbidden_modules =
    factory.adapters
    factory.context
    factory.decisions
    factory.decompose
    factory.diagnostics
    factory.gates
    factory.github
    factory.planning
    factory.project
    factory.review
    factory.runtime
    factory.quality
    factory.test_suite
    factory.yaml_checks

[importlinter:contract:check-declarations]
name = Shared check declarations do not depend on feature packages
type = forbidden
source_modules = factory.checks
forbidden_modules =
    factory.adapters
    factory.context
    factory.decisions
    factory.decompose
    factory.diagnostics
    factory.gates
    factory.github
    factory.planning
    factory.project
    factory.review
    factory.runtime
    factory.tasks

[importlinter:contract:task-contracts]
name = Task contracts do not depend on project or runtime
type = forbidden
source_modules = factory.tasks
forbidden_modules =
    factory.project
    factory.runtime

[importlinter:contract:project-policy-contracts]
name = Project policy selection and contracts do not depend on runtime
type = forbidden
source_modules =
    factory.project.contracts
    factory.project.profile_rules
forbidden_modules = factory.runtime
