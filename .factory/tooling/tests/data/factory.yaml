# Application profile: documents, rules and project gates.
project: project/project.yaml

# Coordinator instructions for selecting the team and workers.
router: workflow/router.md

# Coordinator instructions for launching, waiting and accepting results.
orchestration: workflow/orchestration.md

# Shared task retry budgets; changing the worker does not reset the counter.
execution:
  retry_budgets:
    static: 2
    tests: 2
    docs: 2
    review:
      feature: 2
      other: 1
    recovery: 1
  on_budget_exhausted: human

# Agent workers receive goals and choose their next action within the assignment.
# Registered checks run as command workers using the accepted check definition.
# Variants do not override shared fields. Variant names are unique across the factory.
agent_workers:
  implementer:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp:
      - context7.resolve-library-id
      - context7.query-docs
    default: middle-implementer
    variants:
      middle-implementer:
        model: terra
        adapter: codex
        escalation:
          to: senior-implementer
          after_failed_attempts: 1
      junior-implementer:
        model: luna
        adapter: codex
        escalation:
          to: middle-implementer
          after_failed_attempts: 1
      senior-implementer:
        model: sol
        adapter: codex
        escalation:
          to: human
          after_failed_attempts: 2
      middle-implementer-zcode:
        model: glm-5-3
        adapter: zcode
        escalation:
          to: senior-implementer
          after_failed_attempts: 1

  tester:
    capabilities: {read: true, edit: false, commands: true, web: false}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    default: tester
    variants:
      tester:
        model: luna
        adapter: codex

  teacher:
    role: roles/teacher.md
    contract: contracts/teacher.md
    capabilities: {read: true, edit: true, commands: true, web: false}
    enforcement: instructions
    mcp: []
    default: teacher
    variants:
      teacher:
        model: sol-medium
        adapter: codex

  judge:
    role: roles/judge.md
    contract: contracts/judge.md
    capabilities: {read: true, edit: false, commands: true, web: false}
    enforcement: instructions
    mcp: []
    variants:
      judge:
        model: sol
        adapter: codex

  code-explorer:
    role: roles/code-explorer.md
    contract: contracts/code-explorer.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
    variants:
      code-explorer:
        model: sol
        adapter: codex

  bug-hunter:
    role: roles/bug-hunter.md
    contract: contracts/bug-hunter.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
      - dart.dtd
      - dart.get_runtime_errors
      - dart.hot_restart
      - dart.hot_reload
    variants:
      bug-hunter:
        model: sol
        adapter: codex

  doc-writer:
    role: roles/doc-writer.md
    contract: contracts/doc-writer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      doc-writer:
        model: sol
        adapter: codex

  architect:
    role: roles/architect.md
    contract: contracts/architect.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      architect:
        model: sol
        adapter: codex

  task-decomposer:
    role: roles/task-decomposer.md
    contract: contracts/task-decomposer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-decomposer:
        model: sol
        adapter: codex

  task-reviewer:
    role: roles/task-reviewer.md
    contract: contracts/task-reviewer.md
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-reviewer:
        model: sol
        adapter: codex

  reviewer:
    role: roles/reviewer.md
    contract: contracts/reviewer.md
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    variants:
      reviewer:
        model: sol
        adapter: codex

# Models: exact ID and parameters, referenced by variants.
models:
  sol-medium:
    id: gpt-6.2-sol
    effort: medium
  terra:
    id: gpt-6.1-terra
    effort: high
  luna:
    id: gpt-6-luna
    effort: high
  sol:
    id: gpt-6.1-sol
    effort: high
  glm-5-3:
    id: builtin:zai-coding-plan\GLM-5.3

# Adapters: harness, transport and participant instructions.
adapters:
  codex:
    instructions: adapters/codex.md
    worker_instructions: adapters/worker/codex.md
    harness: codex
    runner: native
  claude:
    instructions: adapters/claude.md
    worker_instructions: adapters/worker/claude.md
    harness: claude
    runner: native
  zcode:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: zcode
    runner: acpx
    connection: zcode

# Shared local limit native-workers, excluding the coordinator.
native:
  max_parallel_agents: 3

# Client ACP and connections; each backend has its own limit.
acpx:
  command: acpx
  connections:
    zcode:
      command: zcode-acp
      args:
        - server
      max_parallel_agents: 3
      permissions: approve-reads
