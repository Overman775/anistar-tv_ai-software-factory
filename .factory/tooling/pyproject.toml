[tool.ruff]
target-version = "py311"
line-length = 100
preview = false
respect-gitignore = false
force-exclude = true
exclude = [".venv", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100", "PGH003", "PGH004", "S307", "S506", "S602"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["factory", "bootstrap", "tests"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
python_version = "3.11"
strict = true
disallow_any_unimported = true
explicit_package_bases = true
show_error_codes = true
pretty = false

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = [".", "factory", "../gates", "../project/gates", "../project/examples/gates", "../skills/factory-pr/scripts", "../skills/factory-code-review/scripts"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
include_namespace_packages = true
