[importlinter]
root_package = factory_tooling
include_external_packages = False

[importlinter:contract:decision-boundary]
name = Decision contracts stay independent of consumers
type = forbidden
source_modules = factory_tooling.decisions
forbidden_modules =
    factory_tooling.runtime
    factory_tooling.project
    factory_tooling.context
    factory_tooling.adapters
    factory_tooling.review
    factory_tooling.planning
    factory_tooling.decompose

[importlinter:contract:context-boundary]
name = Context construction does not import workflow transitions or transports
type = forbidden
source_modules = factory_tooling.context
forbidden_modules =
    factory_tooling.runtime.workflow
    factory_tooling.adapters

[importlinter:contract:process-boundary]
name = Command execution does not own workflow or review decisions
type = forbidden
source_modules = factory_tooling.runtime.check_process
forbidden_modules =
    factory_tooling.runtime.workflow
    factory_tooling.review
    factory_tooling.project
