# Export approved production observations through the separate OTLP bridge.
telemetry:
  enabled: true
  endpoint: http://localhost:4318/v1/traces
  headers:
    Authorization: "Bearer ${env:OTLP_TOKEN}"

# Tutorial example. Selected explicitly; does not overwrite existing settings.

# Application profile: documents, rules and project gates.
project: project/project.yaml

# Coordinator instructions for selecting the team and workers.
router: workflow/router.md

# Coordinator instructions for launching, waiting and accepting results.
orchestration: workflow/orchestration.md

# Reserved model alias for a future separate Orchestrator launch.
# Skill invocation uses the current session model and effort.
# Future separate launch requires this alias to have explicit id and effort;
# the current loader checks the alias only.
orchestrator:
  model: sol

# Shared task retry budgets; changing the worker does not reset the counter.
execution:
  # shared uses the current checkout; worktree creates a separate Git checkout.
  # container is reserved and blocks runs until a runtime is implemented.
  workspace: worktree
  retry_budgets:
    static: 2
    tests: 2
    docs: 2
    review:
      feature: 2
      other: 1
    recovery: 1
  on_budget_exhausted: human

# Agent workers receive goals and choose their next action within the assignment.
# Registered checks run as command workers using the accepted check definition.
# role and contract default to roles/<group>.md and contracts/<group>.md.
# Explicit paths must match these canonical paths.
# Variants do not override shared fields. Variant names are unique across the factory.
# default required with multiple variants. Implementer always starts at that default.
# capabilities/MCP — instruction policy, not sandbox; enforcement: required blocks generic dispatch.
# MCP servers and secrets are configured in harness, not here.
agent_workers:
  implementer:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp:
      - context7.resolve-library-id
      - context7.query-docs
    default: middle-implementer
    variants:
      middle-implementer:
        model: terra
        adapter: codex
        escalation:
          to: senior-implementer
          after_failed_attempts: 1
      junior-implementer:
        model: luna
        adapter: codex
        escalation:
          to: middle-implementer
          after_failed_attempts: 1
      senior-implementer:
        model: sol
        adapter: codex
        escalation:
          to: human
          after_failed_attempts: 2
      implementer-deepseek:
        model: deepseek-flash-1017
        adapter: opencode
      implementer-glm:
        model: glm-5-3
        adapter: opencode

  tester:
    capabilities: {read: true, edit: false, commands: true, web: false}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    default: tester
    variants:
      tester:
        model: luna
        adapter: codex

  teacher:
    capabilities: {read: true, edit: true, commands: true, web: false}
    enforcement: instructions
    mcp: []
    default: teacher
    variants:
      teacher:
        model: sol-medium
        adapter: codex

  judge:
    capabilities: {read: true, edit: false, commands: true, web: false}
    enforcement: instructions
    mcp: []
    variants:
      judge:
        model: sol
        adapter: codex

  code-explorer:
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
    variants:
      code-explorer:
        model: sol
        adapter: codex

  bug-hunter:
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
      - context7.resolve-library-id
      - context7.query-docs
      - dart.dtd
      - dart.get_runtime_errors
      - dart.hot_restart
      - dart.hot_reload
    variants:
      bug-hunter:
        model: sol
        adapter: codex

  doc-writer:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      doc-writer:
        model: sol
        adapter: codex

  architect:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      architect:
        model: astra
        adapter: codex

  task-decomposer:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-decomposer:
        model: sol
        adapter: codex

  task-reviewer:
    capabilities: {read: true, edit: true, commands: true, web: true}
    enforcement: instructions
    mcp: []
    variants:
      task-reviewer:
        model: sol
        adapter: codex

  reviewer:
    capabilities: {read: true, edit: false, commands: true, web: true}
    enforcement: instructions
    mcp:
      - dart.analyze_files
      - dcm.dcm_analyze
    variants:
      reviewer:
        model: sol
        adapter: codex

# Models: exact ID and parameters, referenced by variants.
models:
  sol-medium:
    id: gpt-6.2-sol
    effort: medium
  # Primary model for native workers.
  terra:
    id: gpt-6.1-terra
    # Requested reasoning level; applies only when supported by the harness.
    effort: high

  # Junior model from the accepted allocation.
  luna:
    id: gpt-6-luna
    effort: high

  # Model for senior and other specialties.
  sol:
    id: gpt-6.1-sol
    effort: medium
  astra:
    id: gpt-6-astra
    effort: medium

  glm-5-3:
    id: openrouter/z-ai/glm-5.3
    effort: max
  deepseek-flash-1017:
    id: openrouter/deepseek/deepseek-v4.1-flash-1017
    effort: max

  # Pi ACP accepts provider/model. deepseek-flash — API alias for the V4.1 Flash family.
  # Provider, key and model must be configured beforehand in Pi.
  deepseek-flash:
    id: deepseek/deepseek-flash

# Adapter connects the harness to the transport. This is not a model.
adapters:
  codex:
    # Coordinator instructions: creation, waiting, recovery.
    instructions: adapters/codex.md
    # Worker instructions for available harness tools.
    worker_instructions: adapters/worker/codex.md
    # Harness in which the agent runs.
    harness: codex
    # native — API of the current harness; acpx — external ACP client.
    runner: native

  # Native Claude adapter; requires a profile with a model supported by this harness.
  claude:
    instructions: adapters/claude.md
    worker_instructions: adapters/worker/claude.md
    harness: claude
    runner: native


  zcode:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: zcode
    runner: acpx
    connection: zcode

  opencode:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: opencode
    runner: acpx
    connection: opencode

  # Pi — harness; used bridge — svkozak/pi-acp.
  pi:
    instructions: adapters/acpx.md
    worker_instructions: adapters/worker/acpx.md
    harness: pi
    runner: acpx
    connection: pi

# Local pool of unfinished native assignments, excluding the coordinator.
native:
  max_parallel_agents: 3  # factory limit, not a subscription quota

# Actual acpx CLI settings; backend processes run separately.
acpx:
  # Installed client command. Helper does not install packages.
  command: acpx
  # One connection shares a pool across all assigned profiles.
  connections:
    zcode:
      command: zcode-acp
      args:
        - server
      max_parallel_agents: 3
      permissions: approve-reads

    opencode:
      command: opencode
      args: [acp]
      max_parallel_agents: 8
      permissions: approve-all

    # svkozak/pi-acp launches without server and uses the installed Pi.
    # MCP requires a separate Pi extension; accepted ACP mcpServers are not connected automatically.
    # Pi runs file operations and commands locally, without ACP fs/terminal delegation.
    pi:
      command: pi-acp
      args: []
      max_parallel_agents: 3
      permissions: approve-reads
