name: ui_kit
description: Shared theme and UI primitives for Anistar TV.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  skeletonizer: ^2.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
