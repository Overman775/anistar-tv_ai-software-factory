name: ui_kit
description: Shared theme and UI primitives for Anistar TV.
version: 0.0.1
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0 <4.0.0"

dependencies:
  cached_network_image: ^4.0.7
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  sizer: ^3.1.3
  skeletonizer: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.2
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  licenses:
    - assets/fonts/Manrope-OFL.txt
    - assets/icons/LICENSE
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_gen:
  output: lib/src/generate/
  line_length: 120
  assets:
    outputs:
      package_parameter_enabled: true
  fonts:
    outputs:
      package_parameter_enabled: true
  integrations:
    image: true
