name: ui_kit
description: Shared theme and UI primitives for Anistar TV.
version: 0.0.1
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7 <4.0.0"

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  material_ui: ^1.6.0
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  licenses:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
