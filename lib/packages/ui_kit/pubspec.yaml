name: ui_kit
description: Shared theme and UI primitives for Anistar TV.
version: 0.0.1
publish_to: "none"
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7 <4.0.0"

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  material_ui: ^1.7.0
  sizer: ^3.1.3
  skeletonizer: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  licenses:
    - assets/fonts/Manrope-OFL.txt
    - assets/icons/LICENSE
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800

flutter_gen:
  output: lib/src/generate/
  line_length: 120
  assets:
    outputs:
      package_parameter_enabled: true
  fonts:
    outputs:
      package_parameter_enabled: true
  integrations:
    image: true
