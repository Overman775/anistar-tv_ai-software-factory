name: anistar_tv
description: "A Flutter application for watching videos on Android TV and phones."
publish_to: "none"

version: 1.3.0+6

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.7 <4.0.0"

workspace:
  - infrastructure/core
  - infrastructure/networking
  - infrastructure/storage
  - infrastructure/app_logging
  - infrastructure/anistar
  - lib/packages/ui_kit

dependencies:
  anistar:
    path: infrastructure/anistar
  app_logging:
    path: infrastructure/app_logging
  core:
    path: infrastructure/core
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  material_ui: ^1.7.0
  networking:
    path: infrastructure/networking
  share_plus: ^13.3.1
  storage:
    path: infrastructure/storage
  ui_kit:
    path: lib/packages/ui_kit
  video_player: ^2.14.1

dev_dependencies:
  analyzer: ^13.3.0
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  http: ^1.6.0
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  melos: 7.8.1
  shared_preferences: ^2.5.6
  video_player_platform_interface: ^6.9.0
  yaml: ^3.1.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/packages/ui_kit/assets/images/anistar_launcher.png"
  adaptive_icon_background: "#101214"
  adaptive_icon_foreground: "lib/packages/ui_kit/assets/images/anistar_launcher.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

# One command interface over the existing Dart pub workspace; app stays in root.
melos:
  sdkPath: .fvm/flutter_sdk
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  command:
    bootstrap:
      hooks:
        post: "python3 tool/graphify/prepare.py --optional"
  scripts:
    analyze:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:analyze --include-private
      description: "Strict analyzer for app and all workspace packages"

    clean:
      run: "flutter clean"
      description: "Clean app build output"

    clean:all:
      run: "dart run melos run clean && dart run melos run generate:clean"
      description: "Clean app and code generator caches"

    format:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:format --include-private
      description: "Format maintained Dart sources"

    format:check:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:format-check --include-private
      description: "Check format without editing files"

    fix:
      run: "dart fix --apply"
      description: "Apply Dart fixes; inspect resulting diff"

    fix:check:
      run: "dart fix --dry-run"
      description: "Preview Dart fixes"

    dcm:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:dcm --include-private
      description: "Strict DCM analysis including tests"

    dcm:fix:
      run: "bash scripts/dcm_fix.sh"
      description: "Apply DCM fixes; inspect resulting diff"

    fix:all:
      run: "dart run melos run fix && dart run melos run dcm:fix"
      description: "Apply Dart and DCM fixes sequentially"

    check:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:format-check --include-private
        - dart run melos run quality:analyze --include-private
        - dart run melos run quality:dcm --include-private
        - dart run melos run quality:unit --include-private
        - dart run melos run quality:goldens --include-private
        - dart run melos run test:tooling --include-private
        - dart run melos run version:check --include-private
      description: "SDK, lockfile, format, analyzer, DCM, unit, golden and tooling checks"

    check:flutter:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:format-check --include-private
        - dart run melos run quality:analyze --include-private
        - dart run melos run quality:unit --include-private
        - dart run melos run quality:goldens --include-private
      description: "Local Flutter-only checks without DCM"

    security:secrets:
      run: "bash scripts/security_gitleaks.sh history"
      description: "Scan all committed Git history for secrets offline"

    security:deps:
      run: "bash scripts/security_osv.sh"
      description: "Check the workspace lockfile against OSV advisories online"

    security:code:
      run: "bash scripts/security_semgrep.sh"
      description: "Scan maintained code with local Semgrep rules offline"

    security:
      steps:
        - dart run melos run security:secrets
        - dart run melos run security:deps
        - dart run melos run security:code
      description: "Run secrets, dependency and code security scans sequentially"

    get:
      run: "flutter pub get --enforce-lockfile"
      description: "Resolve the whole workspace using the committed lockfile"

    upgrade:
      run: "flutter pub upgrade"
      description: "Upgrade compatible workspace dependencies"

    upgrade:major:
      run: "flutter pub upgrade --major-versions"
      description: "Upgrade constraints and dependencies; explicit maintenance command"

    outdated:
      run: "flutter pub outdated"
      description: "Inspect workspace dependency updates"

    deps:
      run: "flutter pub deps"
      description: "Show workspace dependency graph"

    workspace:
      run: "dart run melos list"
      description: "List app and six local packages"

    doctor:
      run: "flutter doctor -v"
      description: "Diagnose local Flutter and Android tooling"

    devices:
      run: "flutter devices"
      description: "List attached devices"

    emulators:
      run: "flutter emulators"
      description: "List configured emulators"

    generate:
      run: "bash scripts/generate.sh"
      description: "Generate typed routes and FlutterGen assets sequentially"

    build_runner:
      run: "dart run melos run generate"
      description: "Compatibility alias for RC quick start"

    generate:assets:
      run: "dart run melos run generate"
      description: "Generate FlutterGen assets and fonts with typed routes"

    watch:
      run: "dart run build_runner watch --workspace"
      description: "Watch workspace code generation; long running"

    generate:clean:
      run: "dart run build_runner clean --workspace"
      description: "Clean workspace generator cache"

    build_runner:clean:
      run: "dart run melos run generate:clean"
      description: "Compatibility alias for generator cache cleaning"

    generate:branding:
      run: "bash scripts/generate_branding.sh"
      description: "Export Android TV launcher, banner and safe splash (macOS)"

    generate:icon:
      run: "dart run melos run generate:branding"
      description: "Export icons with TV dimensions and safe splash"

    generate:splash:
      run: "dart run melos run generate:branding"
      description: "Export splash with Android 12 safe wrapper and TV icons"

    generate:e2e-media:
      private: true
      run: "bash scripts/regenerate_e2e_media.sh"
      description: "Regenerate local 360p/720p HLS fixtures (FFmpeg required)"

    check:apk:
      private: true
      run: "python3 tool/quality/verify_android_apk.py"
      description: "Verify prod release APK freshness for every AOT ABI"

    graph:update:
      private: true
      run: "python3 tool/graphify/prepare.py --update"
      description: "Refresh local code knowledge graph (optional graphify)"

    graph:check:
      private: true
      run: "python3 tool/graphify/prepare.py --check"
      description: "Check graphify extractor patch and regression tests (optional)"

    vcs:check:
      run: "git diff --check"
      description: "Check whitespace and conflict markers in local diff"

    version:show:
      run: "python3 tool/version/app_version.py show"
      description: "Show the app version from the root pubspec"

    version:check:
      private: true
      run: bash scripts/with_python.sh python3 tool/version/app_version.py check
      description: "Validate current app version without Git changes"

    version:plan:
      run: "python3 tool/version/app_version.py plan"
      description: "Preview patch/minor/major/build increment; pass bump argument"

    version:set:
      run: "python3 tool/version/app_version.py set"
      description: "Preview explicit version/build; writes only with --write"

    test:unit:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:unit --include-private
      description: "Run unit from central test suite"

    test:goldens:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:goldens --include-private
      description: "Run goldens from central test suite"

    test:goldens:update:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:goldens:update --include-private
      description: "Run goldens:update from central test suite"

    test:coverage:
      steps:
        - dart run melos run quality:prepare --include-private
        - dart run melos run quality:unit --include-private
      description: "Run coverage from central test suite"

    test:tooling:
      run: "bash scripts/with_python.sh bash scripts/test_tooling.sh"
      description: "Run Python quality, E2E runner, version and optional graphify regressions"

    test:e2e:
      run: "bash scripts/with_python.sh bash scripts/e2e-all.sh"
      description: "Run TV and mobile fixtures sequentially on separate emulators"

    test:e2e:ios:
      run: "bash scripts/with_python.sh bash scripts/e2e-ios.sh"
      description: "Optional iOS native fixtures: simulator UDID, dev|prod, optional mobile|tv (iPad diagnostic)"

    env:prepare:
      run: "bash scripts/with_python.sh python3 tool/environment/prepare.py"
      description: "Validate dev/prod JSON; create only missing local prod from public template"

    build:ios:dev:simulator:
      run: "bash scripts/flutter_app.sh ios dev debug --simulator"
      description: "Build dev debug for iPhone Simulator"

    build:ios:prod:simulator:
      run: "bash scripts/flutter_app.sh ios prod debug --simulator"
      description: "Build prod debug for iPhone Simulator"

    test:e2e:tv:
      private: true
      run: "bash scripts/with_python.sh bash scripts/e2e-tv.sh"
      description: "Run Android TV fixture E2E; optional emulator serial"

    test:e2e:mobile:
      private: true
      run: "bash scripts/with_python.sh bash scripts/e2e-mobile.sh"
      description: "Run Android mobile fixture E2E; optional emulator serial"

    test:e2e:live:
      private: true
      run: "bash scripts/with_python.sh bash scripts/e2e_live.sh"
      description: "Run live TV account scenario; changes remote watched history, explicit only"

    test:network:live:
      private: true
      run: "flutter test tool/diagnostics/anistar_network_test.dart --reporter=expanded"
      description: "Read-only live network/login diagnosis with local credentials"

    run:dev:
      run: "bash scripts/flutter_app.sh run dev debug"
      description: "Run dev app; optional Flutter arguments"

    build:android:dev:apk:
      run: "bash scripts/flutter_app.sh apk dev release"
      description: "Build dev release apk; APK includes AOT freshness check"

    build:android:dev:bundle:
      run: "bash scripts/flutter_app.sh bundle dev release"
      description: "Build dev release bundle; APK includes AOT freshness check"

    build:android:dev:apk:debug:
      run: "bash scripts/flutter_app.sh apk dev debug"
      description: "Build dev debug APK"

    run:prod:
      run: "bash scripts/flutter_app.sh run prod debug"
      description: "Run prod app; optional Flutter arguments"

    build:android:prod:apk:
      run: "bash scripts/flutter_app.sh apk prod release"
      description: "Build prod release apk; APK includes AOT freshness check"

    build:android:prod:bundle:
      run: "bash scripts/flutter_app.sh bundle prod release"
      description: "Build prod release bundle; APK includes AOT freshness check"

    build:android:prod:apk:unsigned:
      run: "ANISTAR_ANDROID_SIGNING_MODE=unsigned bash scripts/flutter_app.sh apk prod release"
      description: "Build unsigned prod APK locally without signing credentials; includes AOT freshness check"

    build:android:prod:apk:debug:
      run: "bash scripts/flutter_app.sh apk prod debug"
      description: "Build prod debug APK"

    # Explicit local-package invocation also works without a global Melos launcher.
    # Preparation belongs to the public profile; leaves never prepare recursively.
    quality:prepare:
      private: true
      run: |
        bash -euo pipefail <<'BASH'
        sdk=${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}
        seed=${ANISTAR_TEST_SEED:-20261010}
        [[ $seed =~ ^[0-9]+$ ]] || { echo "ANISTAR_TEST_SEED must be a non-negative integer." >&2; exit 64; }
        "$sdk/bin/flutter" --no-version-check --version --machine | "$sdk/bin/dart" tool/quality/verify_sdk.dart
        "$sdk/bin/flutter" --no-version-check pub get --enforce-lockfile
        sources=$(find lib infrastructure test integration_test tool/quality \
          -type d \( -name build -o -name .dart_tool \) -prune -o \
          -type f -name '*.dart' ! -name '*.g.dart' ! -name '*.gen.dart' \
          ! -name '*.freezed.dart' ! -name generated_plugin_registrant.dart -print)
        [[ -n $sources ]] || { echo "No maintained Dart sources found." >&2; exit 1; }
        BASH

    quality:format:
      private: true
      run: |
        bash -euo pipefail <<'BASH'
        find lib infrastructure test integration_test tool/quality \
          -type d \( -name build -o -name .dart_tool \) -prune -o \
          -type f -name '*.dart' ! -name '*.g.dart' ! -name '*.gen.dart' \
          ! -name '*.freezed.dart' ! -name generated_plugin_registrant.dart -print0 |
          xargs -0 "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/dart" format
        BASH

    quality:format-check:
      private: true
      run: |
        bash -euo pipefail <<'BASH'
        find lib infrastructure test integration_test tool/quality \
          -type d \( -name build -o -name .dart_tool \) -prune -o \
          -type f -name '*.dart' ! -name '*.g.dart' ! -name '*.gen.dart' \
          ! -name '*.freezed.dart' ! -name generated_plugin_registrant.dart -print0 |
          xargs -0 "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/dart" format --output=none --set-exit-if-changed
        BASH

    quality:analyze:
      private: true
      run: >-
        "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/flutter" --no-version-check
        analyze --no-pub --fatal-infos

    quality:dcm:
      private: true
      run: >-
        dcm analyze lib infrastructure test integration_test tool/quality
        --sdk-path "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/cache/dart-sdk"
        --fatal-style --fatal-warnings --no-analytics

    quality:unit:
      private: true
      run: >-
        "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/flutter" --no-version-check
        test --no-pub --exclude-tags=golden --concurrency=4
        --test-randomize-ordering-seed="${ANISTAR_TEST_SEED:-20261010}" --coverage
        --coverage-package=anistar_tv --coverage-package=core --coverage-package=networking
        --coverage-package=storage --coverage-package=app_logging --coverage-package=anistar
        --coverage-package=ui_kit

    quality:goldens:
      private: true
      run: >-
        "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/flutter" --no-version-check
        test --no-pub --tags=golden --concurrency=1
        --test-randomize-ordering-seed="${ANISTAR_TEST_SEED:-20261010}"

    quality:goldens:update:
      private: true
      run: >-
        "${ANISTAR_FLUTTER_SDK:-$PWD/.fvm/flutter_sdk}/bin/flutter" --no-version-check
        test --no-pub --tags=golden --concurrency=1
        --test-randomize-ordering-seed="${ANISTAR_TEST_SEED:-20261010}" --update-goldens
