name: anistar_tv
description: "A Flutter TV application for watching videos."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  api:
    path: api
  cached_network_image: ^3.4.1
  dio: ^5.10.0
  dio_smart_retry: ^7.0.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.3
  logger: ^2.5.0
  path_provider: ^2.0.0
  share_plus: ^13.2.1
  shared_preferences: ^2.5.3
  ui_kit:
    path: lib/packages/ui_kit
  video_player: ^2.13.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.3.1
  http_mock_adapter: ^0.6.1
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "resources/android_icon.png"
  min_sdk_android: 21
