name: anistar_tv
description: "A Flutter TV application for watching videos."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State management
  provider: ^6.1.4

  # Data models
  freezed: ^3.0.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.5.3

  # Video player
  video_player: ^2.9.5

  # Image handling
  cached_network_image: ^3.4.1

  # Utilities
  logger: ^2.5.0
  flutter_inappwebview: ^6.0.0 # For handling web content and bypassing CF
  html: ^0.15.5 # For parsing HTML
  dio: ^5.8.0+1 # For making HTTP requests
  dio_http2_adapter: ^2.6.0 # HTTP/2 adapter for Dio
  cookie_jar: ^4.0.8 # Cookie manager for Dio
  dio_cookie_manager: ^3.1.1 # Cookie manager interceptor for Dio
  puppeteer: ^3.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
