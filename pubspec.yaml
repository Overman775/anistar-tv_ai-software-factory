name: anistar_tv
description: "A Flutter TV application for watching videos."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^15.1.2

  # State management
  provider: ^6.1.4
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5 # Add equatable

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Video player
  video_player: ^2.9.5

  # Image handling
  cached_network_image: ^3.4.1

  # Utilities
  logger: ^2.5.0
  flutter_inappwebview: ^6.1.5 # For handling web content and bypassing CF
  html: ^0.15.5 # For parsing HTML
  path_provider: ^2.0.0 # Add path_provider
  intl: ^0.19.0 # Add intl
  share_plus: ^11.0.0 # Add share_plus (optional), upgraded to resolve conflict

  # Splash and icons
  flutter_native_splash: ^2.4.6

  # UI Kit
  ui_kit:
    path: lib/packages/ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.0.4
  json_serializable: ^6.9.4
  go_router_builder: ^2.9.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.0 # Added for mocking
  bloc_test: ^10.0.0 # Added for bloc testing

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "resources/android_icon.png"
  min_sdk_android: 21
