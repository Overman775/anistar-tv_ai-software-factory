name: anistar_tv
description: "A Flutter TV application for watching videos."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Generated AniStar Parser API client
  anistar_api:
    path: packages/anistar_api

  # Navigation
  go_router: ^17.3.0

  # State management
  provider: ^6.1.4
  flutter_bloc: ^9.1.0
  # Data models
  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1

  # Image handling
  cached_network_image: ^3.4.1

  # Utilities
  logger: ^2.5.0
  path_provider: ^2.0.0
  intl: ^0.20.3
  share_plus: ^13.2.1

  # UI Kit
  ui_kit:
    path: lib/packages/ui_kit
  dio: ^5.10.0
  video_player: ^2.13.0
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.3.1
  build_runner: ^2.4.15
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3
  http_mock_adapter: ^0.6.1
  bloc_test: ^10.0.0
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "resources/android_icon.png"
  min_sdk_android: 21
