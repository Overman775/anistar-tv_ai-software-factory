name: anistar_tv
description: "A Flutter TV application for watching videos."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^15.1.2

  # State management
  provider: ^6.1.4
  flutter_bloc: ^9.1.0 # Add flutter_bloc

  # Data models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Video player
  video_player: ^2.9.5

  # Image handling
  cached_network_image: ^3.4.1

  # Utilities
  logger: ^2.5.0
  flutter_inappwebview: ^6.1.5 # For handling web content and bypassing CF
  html: ^0.15.5 # For parsing HTML

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.0.4 # Move freezed here
  json_serializable: ^6.9.4
  go_router_builder: ^2.9.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
