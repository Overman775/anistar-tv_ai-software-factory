<!doctype html>
<meta charset="utf-8">
<title>AniStar browser experiment</title>
<h1>AniStar browser experiment</h1>
<pre>Running…</pre>
<script>
// Serve this file beside private_urls.json generated by bin/probe.dart.
// Signed media URLs stay in the private temporary output directory.
async function run() {
  const urls = await (await fetch('private_urls.json')).json();
  const rows = [];
  for (const [name, url] of Object.entries(urls)) {
    if (name.startsWith('episode2_')) continue;
    const abort = new AbortController();
    const timer = setTimeout(() => abort.abort(), 20000);
    try {
      const headers = name.startsWith('segment_') || name.startsWith('mp4_')
        ? {Range: 'bytes=0-4095', Referer: urls.player} : {};
      const response = await fetch(url, {headers, signal: abort.signal});
      const bytes = await response.arrayBuffer();
      rows.push({name, status: response.status, type: response.headers.get('Content-Type'), contentRange: response.headers.get('Content-Range'), bytes: bytes.byteLength, firstByte: new Uint8Array(bytes)[0]});
    } catch (error) {
      rows.push({name, error: String(error)});
    } finally {
      clearTimeout(timer);
    }
    document.querySelector('pre').textContent = JSON.stringify(rows, null, 2);
  }
  const opaque = await fetch(urls.catalog, {mode: 'no-cors'});
  rows.push({name: 'catalog_no_cors', type: opaque.type, status: opaque.status, body: (await opaque.text()).length});
  const foreign = await fetch(urls.segment_360, {referrer: urls.player, referrerPolicy: 'unsafe-url', headers: {Range: 'bytes=0-4095'}});
  rows.push({name: 'foreign_referrer_option', status: foreign.status});
  document.querySelector('pre').textContent = JSON.stringify(rows, null, 2);
  document.title = 'AniStar probe complete';
}
run().catch(error => document.querySelector('pre').textContent += '\n' + error);
</script>
